[project]
name = "trading-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Davis",email = "davis@lawsnote.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yfinance (>=1.3.0,<2.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "backtrader (>=1.9.78.123,<2.0.0.0)"
]

[tool.poetry]
packages = [{include = "trading_bot", from = "src"}]

[tool.black]
line-length = 150

[tool.isort]
profile = "black"
line_length = 150

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "isort (>=8.0.1,<9.0.0)"
]
